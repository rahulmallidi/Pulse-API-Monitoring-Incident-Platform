# Oracle / cloud-friendly Compose stack.
# Pre-install deps + build web on the host/bootstrap script BEFORE `up`.
# Only API (:3000) and web (:3005) are published.
#
#   echo "PUBLIC_HOST=http://YOUR_PUBLIC_IP" > .env
#   docker compose -f deploy/docker-compose.oracle.yml --env-file .env up -d

services:
  postgres:
    image: timescale/timescaledb:2.16.1-pg16
    container_name: pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    volumes:
      - pulse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: pulse-redis
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v24.2.10
    container_name: pulse-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092

  api:
    image: node:20-bookworm-slim
    container_name: pulse-api
    restart: unless-stopped
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        corepack enable
        pnpm --filter @pulse/api exec nest start
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://pulse:pulse@postgres:5432/pulse?schema=public
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
      KAFKA_CLIENT_ID: pulse
      CORS_ORIGIN: ${PUBLIC_HOST:-http://localhost}:3005
      CORS_ALLOW_VERCEL: "true"
    ports:
      - "3000:3000"
    volumes:
      - ../:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      redpanda:
        condition: service_started

  scheduler:
    image: node:20-bookworm-slim
    container_name: pulse-scheduler
    restart: unless-stopped
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        corepack enable
        pnpm --filter @pulse/scheduler exec nest start
    environment:
      PORT: "3002"
      DATABASE_URL: postgresql://pulse:pulse@postgres:5432/pulse?schema=public
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
      KAFKA_CLIENT_ID: pulse
    volumes:
      - ../:/workspace
    depends_on:
      - postgres
      - redis
      - redpanda
      - api

  probe:
    image: node:20-bookworm-slim
    container_name: pulse-probe
    restart: unless-stopped
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        corepack enable
        pnpm --filter @pulse/probe exec nest start
    environment:
      PORT: "3001"
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
      KAFKA_CLIENT_ID: pulse
      REGION: all
    volumes:
      - ../:/workspace
    depends_on:
      - redpanda
      - scheduler

  ingestor:
    image: node:20-bookworm-slim
    container_name: pulse-ingestor
    restart: unless-stopped
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        corepack enable
        pnpm --filter @pulse/ingestor exec nest start
    environment:
      PORT: "3003"
      DATABASE_URL: postgresql://pulse:pulse@postgres:5432/pulse?schema=public
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
      KAFKA_CLIENT_ID: pulse
    volumes:
      - ../:/workspace
    depends_on:
      - postgres
      - redis
      - redpanda
      - probe

  alerter:
    image: node:20-bookworm-slim
    container_name: pulse-alerter
    restart: unless-stopped
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        corepack enable
        pnpm --filter @pulse/alerter exec nest start
    environment:
      PORT: "3004"
      DATABASE_URL: postgresql://pulse:pulse@postgres:5432/pulse?schema=public
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
      KAFKA_CLIENT_ID: pulse
    volumes:
      - ../:/workspace
    depends_on:
      - postgres
      - redis
      - redpanda
      - probe

  web:
    image: node:20-bookworm-slim
    container_name: pulse-web
    restart: unless-stopped
    working_dir: /workspace
    command:
      - sh
      - -c
      - |
        corepack enable
        pnpm --filter @pulse/web start
    environment:
      PORT: "3005"
      PUBLIC_HOST: ${PUBLIC_HOST:-http://localhost}
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_HOST:-http://localhost}:3000
    ports:
      - "3005:3005"
    volumes:
      - ../:/workspace
    depends_on:
      - api

volumes:
  pulse-postgres-data:
