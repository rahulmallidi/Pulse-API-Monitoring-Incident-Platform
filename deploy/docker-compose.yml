services:
  postgres:
    image: timescale/timescaledb:2.16.1-pg16
    container_name: pulse-postgres
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - pulse-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: pulse-redis
    ports:
      - "6379:6379"

  redpanda:
    image: redpandadata/redpanda:v24.2.10
    container_name: pulse-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"

  api:
    image: node:20-alpine
    container_name: pulse-api
    working_dir: /workspace
    command: ["sh", "-c", "corepack enable && pnpm install --config.confirmModulesPurge=false && pnpm --filter @pulse/api exec nest start --watch"]
    environment:
      PORT: "3000"
      DATABASE_URL: "postgresql://pulse:pulse@postgres:5432/pulse?schema=public"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_CLIENT_ID: "pulse"
      CORS_ORIGIN: "http://localhost:3005"
    ports:
      - "3000:3000"
    volumes:
      - ../:/workspace
    depends_on:
      - postgres
      - redis
      - redpanda

  scheduler:
    image: node:20-alpine
    container_name: pulse-scheduler
    working_dir: /workspace
    command: ["sh", "-c", "corepack enable && pnpm install --config.confirmModulesPurge=false && pnpm --filter @pulse/scheduler exec nest start --watch"]
    environment:
      PORT: "3002"
      DATABASE_URL: "postgresql://pulse:pulse@postgres:5432/pulse?schema=public"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_CLIENT_ID: "pulse"
    ports:
      - "3002:3002"
    volumes:
      - ../:/workspace
    depends_on:
      - postgres
      - redis
      - redpanda

  probe:
    image: node:20-alpine
    container_name: pulse-probe-us-east
    working_dir: /workspace
    command: ["sh", "-c", "corepack enable && pnpm install --config.confirmModulesPurge=false && pnpm --filter @pulse/probe exec nest start --watch"]
    environment:
      PORT: "3001"
      DATABASE_URL: "postgresql://pulse:pulse@postgres:5432/pulse?schema=public"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_CLIENT_ID: "pulse"
      REGION: "all"
    ports:
      - "3001:3001"
    volumes:
      - ../:/workspace
    depends_on:
      - redpanda

  ingestor:
    image: node:20-alpine
    container_name: pulse-ingestor
    working_dir: /workspace
    command: ["sh", "-c", "corepack enable && pnpm install --config.confirmModulesPurge=false && pnpm --filter @pulse/ingestor exec nest start --watch"]
    environment:
      PORT: "3003"
      DATABASE_URL: "postgresql://pulse:pulse@postgres:5432/pulse?schema=public"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_CLIENT_ID: "pulse"
    ports:
      - "3003:3003"
    volumes:
      - ../:/workspace
    depends_on:
      - postgres
      - redis
      - redpanda

  alerter:
    image: node:20-alpine
    container_name: pulse-alerter
    working_dir: /workspace
    command: ["sh", "-c", "corepack enable && pnpm install --config.confirmModulesPurge=false && pnpm --filter @pulse/alerter exec nest start --watch"]
    environment:
      PORT: "3004"
      DATABASE_URL: "postgresql://pulse:pulse@postgres:5432/pulse?schema=public"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BROKERS: "redpanda:9092"
      KAFKA_CLIENT_ID: "pulse"
    ports:
      - "3004:3004"
    volumes:
      - ../:/workspace
    depends_on:
      - postgres
      - redis
      - redpanda

  web:
    image: node:20-alpine
    container_name: pulse-web
    working_dir: /workspace
    command: ["sh", "-c", "corepack enable && pnpm install --config.confirmModulesPurge=false && pnpm --filter @pulse/web exec next dev -p 3005"]
    environment:
      NEXT_PUBLIC_API_SSE_URL: "http://localhost:3000/live/probes"
    ports:
      - "3005:3005"
    volumes:
      - ../:/workspace
    depends_on:
      - api

volumes:
  pulse-postgres-data:
